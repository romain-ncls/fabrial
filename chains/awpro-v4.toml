# awpro-v3, reviewed stage by stage before adding any (docs/roadmap.md).
# Work in progress: each change is measured with scripts/stage-report.sh
# on the same takes (docs/reference-chains.md). So far:
# - the expander: a gentle gate that keeps the edges of phrases.
# PipeWire upsamples the headset's 16 kHz to 48 kHz, so this chain runs at
# 48 kHz too.
name = "awpro-v4"
description = "awpro-v3 under review: a gate that keeps the edges of phrases (so far)"
rate = 48000

[[stage]]
type = "deepfilternet3"
attenuation-limit = 80
post-filter-beta = 0.02
min-processing-threshold = -10
max-erb-processing-threshold = 30
max-df-processing-threshold = 20

[[stage]]
type = "expander"
# Starts at -45 dB, gently (2:1, as in v3, which may sound smoother than
# 4:1). It stays open 400 ms after the voice, so the quiet tail of a
# sentence passes, and sees 10 ms ahead, so it is open when a word starts.
threshold = -45
ratio = 2
attack = 5
release = 400
lookahead = 10
knee = -6
release-threshold = -80.01
dry = -80.01 # EasyEffects' "off" for dry still sends -80 dB

[[stage]]
type = "equalizer"
bands = [
  { type = "hi-pass", mode = "rlc-bt", frequency = 50, q = 0.7 },
  { type = "lo-shelf", mode = "rlc-mt", frequency = 90, gain = 3, q = 0.7 },
  { type = "bell", mode = "bwc-mt", frequency = 425, gain = -2, q = 1, slope = 2 },
  { type = "bell", mode = "bwc-bt", frequency = 3500, gain = 3, q = 0.7, slope = 2 },
  { type = "hi-shelf", mode = "lrx-mt", frequency = 9000, gain = 2, q = 0.7 },
]

[[stage]]
type = "compressor"
threshold = -20
ratio = 4
attack = 5
release = 75
knee = -6
makeup = 15
release-threshold = -40
dry = -80.01
