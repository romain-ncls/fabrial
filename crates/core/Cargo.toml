[package]
name = "fabrial-core"
version = "0.1.0"
description = "fabrial's processing chain: the stages and the chain file, with no audio I/O"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
# DeepFilterNet's own Rust code and model, as the LADSPA plugin EasyEffects runs: version
# 0.5.6, built with its default feature, the low-latency DeepFilterNet3 model.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model-ll"] }
ndarray = "0.15"
rubato = "5"
rtrb = "0.4"
