[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/pipewire"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/romain-ncls/fabrial"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
debug = 1 # line tables, for profiling renders

# tract is slow to the point of unusable without optimizations, even in tests.
[profile.dev.package."*"]
opt-level = 3
